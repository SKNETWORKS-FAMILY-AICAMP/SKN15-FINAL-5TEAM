services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: kime-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    stdin_open: true
    tty: true
    networks:
      - kime-network

networks:
  kime-network:
    external: true
    name: kime-network
