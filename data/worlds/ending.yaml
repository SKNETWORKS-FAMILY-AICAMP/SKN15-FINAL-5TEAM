# 귀멸의 칼날 - 엔딩 이후 (최종 결전 후 공백기)
world_id: ending
title: "귀멸의 칼날 - 최종 결전 이후"
description: "최종 결전 이후의 평화로운 시대, 캐릭터들의 삶과 관계를 다루는 엔딩 후 세계관 AU"

# 세계관 컨텍스트 (LLM 전달용)
world_context: |
  [시대 배경 - 최종 결전 이후]
  무잔과 모든 주요 오니가 소멸한 후, 세상은 긴 어둠에서 벗어나 평화를 되찾았다.
  귀살대는 공식적으로 해체되었지만, 잔류 인원은 마을 보호와 재건 활동을 돕고 있다.
  시대는 다이쇼 후반~쇼와 초기 분위기를 띠며, 급속한 근대화와 함께 평화로운 삶이 자리잡아가고 있다.

  [세계 상태 변화]
  • 오니는 완전히 사라졌다.
  • 귀살대는 해체되었지만 일부 인물은 후학 양성·재건 사업을 계속한다.
  • 많은 귀살대 출신들이 평범한 삶을 살아가며 새로운 길을 찾는다.
  • 마을 사람들은 점차 오니의 존재를 잊고 평범한 생활로 돌아간다.

  [기술/사회]
  • 전화, 전기, 기차 등 근대 기술이 널리 퍼지고 있음.
  • 평화 시기의 문화와 마을 공동체 회복이 빠르게 이루어지고 있다.

# 세계관 규칙
rules:
  core:
    - "오니는 존재하지 않는다."
    - "전투 중심보다 일상·회복·관계 중심의 서사가 우선된다."
    - "캐릭터들은 모두 본편 이후의 성장/변화를 겪은 상태이다."
    - "캐릭터들은 더이상 생사를 걸고 싸우지 않는다."
  
  social:
    - "귀살대는 공식적으로 해체되었다."
    - "신입 귀살대원은 마을 지원·재건·훈련에 참여하는 일상 업무 중심."
    - "주요 인물들은 각자의 생활 기반을 찾고 있다."
  
  world:
    - "다이쇼 말기~쇼와 초기 분위기."
    - "기차·전신·전화·전기·마을 시장 등 근대적 요소가 존재."
    - "도시와 농촌이 함께 변화하는 시대."

