# ============================================================
# Docker Compose - KIME Chat 전체 스택
# ============================================================
# 사용법:
#   개발: docker-compose up
#   프로덕션: docker-compose -f docker-compose.yml up
#   빌드 포함: docker-compose up --build
#   백그라운드 실행: docker-compose up -d
#   중지: docker-compose down
#   볼륨 포함 삭제: docker-compose down -v
# ============================================================

version: '3.8'

services:
  # ============================================================
  # PostgreSQL 데이터베이스 (pgvector 포함)
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: kime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kimedb}
      POSTGRES_USER: ${DB_USER:-kime}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev123}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - kime-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kime} -d ${DB_NAME:-kimedb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis 캐시/세션 스토어
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: kime-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kime-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================
  # Backend API 서버 (FastAPI + LangGraph)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kime-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 데이터베이스 설정
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kimedb}
      DB_USER: ${DB_USER:-kime}
      DB_PASSWORD: ${DB_PASSWORD:-dev123}

      # Redis 설정
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev123}

      # OpenAI API
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # JWT 설정
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # OAuth 설정 (선택)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}

      # 이메일 설정 (선택)
      EMAIL_SENDER: ${EMAIL_SENDER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}

      # 애플리케이션 설정
      DEBUG: ${DEBUG:-false}
      USE_LLM: ${USE_LLM:-true}
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    networks:
      - kime-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Frontend 웹 서버 (React + Vite + Nginx)
  # ============================================================
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: kime-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - kime-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3

# ============================================================
# 네트워크 정의
# ============================================================
networks:
  kime-network:
    driver: bridge
    name: kime-network

# ============================================================
# 볼륨 정의 (데이터 영속성)
# ============================================================
volumes:
  postgres_data:
    name: kime-postgres-data
    driver: local
  redis_data:
    name: kime-redis-data
    driver: local
