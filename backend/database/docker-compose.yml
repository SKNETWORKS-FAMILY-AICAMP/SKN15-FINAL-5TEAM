version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: kime-postgres
    environment:
      POSTGRES_USER: kime
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: kimedb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kime -d kimedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kime-network

  redis:
    image: redis:7-alpine
    container_name: kime-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kime-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kime-network:
    driver: bridge
