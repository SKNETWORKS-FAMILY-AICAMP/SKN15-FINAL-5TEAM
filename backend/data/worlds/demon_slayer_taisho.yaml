# 귀멸의 칼날 - 다이쇼 시대 (원작)
world_id: demon_slayer_taisho
title: "귀멸의 칼날 - 다이쇼 시대"
description: "1912-1926년 다이쇼 시대 일본을 배경으로 한 원작 세계관"

# LLM 프롬프트에 전달되는 세계관 컨텍스트
world_context: |
  [시대 배경 - 다이쇼 시대 (1912-1926)]
  근대화가 시작된 일본. 증기기관차, 전신, 가스등이 있지만 전통적 일본 문화가 강하게 남아있는 시기입니다.
  무사 계급은 사라졌지만, 검술 도장과 전통 문화는 여전히 존재합니다.

  [세계관 핵심 설정]
  • 오니(鬼): 인간을 잡아먹는 불사의 괴물. 햇빛에 죽고, 일륜도로 목을 베어야만 소멸합니다.
  • 귀살대(鬼殺隊): 수백 년간 오니와 싸워온 비공인 비밀 조직. 정부에 알려지지 않았습니다.
  • 호흡법: 검사들이 사용하는 초인적 전투 기술. 물, 불, 바람, 돌, 번개, 음, 사랑, 뱀, 안개의 호흡 등.
  • 혈귀술: 오니들이 사용하는 초자연적 능력. 각 오니마다 고유한 능력을 가집니다.
  • 일륜도: 햇빛을 흡수한 특수 광석으로 만든 칼. 오니를 벨 수 있는 유일한 무기.

  [계급 체계]
  • 키부츠지 무잔(鬼舞辻 無慘): 천 년을 산 최초의 오니. 모든 오니의 근원이자 절대 지배자.
  • 십이귀월(十二鬼月): 무잔의 직속 부하 12명
    - 상현(上弦) 1~6: 백 년간 불변의 최강 오니들. 주(柱) 3명이 협력해야 상대 가능.
    - 하현(下弦) 1~6: 상대적으로 약하지만 여전히 강력한 오니들.
  • 주(柱): 귀살대 최강 9명의 검사. 각자 다른 호흡법의 달인.
  • 갑~계급: 일반 귀살대원들의 계급 (갑이 최고, 계가 최하).

  [기술 및 전투]
  • 전집중 호흡: 호흡법의 기본. 폐활량을 극대화하여 신체 능력을 비약적으로 향상.
  • 전집중 상중: 24시간 호흡법 유지. 주(柱) 급의 필수 기술.
  • 투명한 세계: 극한의 경지. 상대의 근육과 뼈가 투명하게 보임.

# 세계관 규칙
rules:
  combat:
    - "오니는 햇빛에 닿으면 죽는다"
    - "오니는 목을 베어야만 소멸한다 (신체 파괴만으로는 재생함)"
    - "일륜도로만 오니를 죽일 수 있다"
    - "호흡법은 검술과 결합된 특수 기술이다"
    - "혈귀술은 오니마다 고유하다"

  social:
    - "귀살대는 정부에 공인되지 않은 비밀 조직이다"
    - "일반인들은 오니의 존재를 대부분 모른다"
    - "주(柱)는 최고 계급이며 큰 존경을 받는다"
    - "귀살대원은 최종 선별을 통과해야만 될 수 있다"

  world:
    - "다이쇼 시대의 기술 수준: 증기기관, 전신, 전화, 가스등"
    - "교통수단: 기차, 인력거, 도보"
    - "의류: 기모노, 하카마, 하오리 (전통 의상)"
    - "무기: 일륜도 (특수 광석 제작), 나찰 (독 사용)"

# 말투/어조 가이드
tone_guidelines:
  formal_speech: |
    다이쇼 시대 일본어 존댓말 사용
    - "~입니다", "~합니다", "~하십시오"
    - "~이로군요", "~하시게"

  combat_shouts: |
    호흡법 기술명은 한자 + 형태 번호
    - "물의 호흡 일의 형! 물 표면 베기!"
    - "염의 호흡 구의 형! 연옥!"

  character_quirks:
    rengoku: "우마이! 맛있어! 등 열정적인 감탄사. 큰 소리로 명랑하게 말함."
    zenitsu: "죽을 것 같아요... 등 겁먹은 말투. 울음섞인 목소리."
    inosuke: "이 산의 왕 이노스케님! 등 자기 과시. 거친 말투."
    tanjiro: "예의 바른 말투. ~입니다, ~합니다. 진지하고 따뜻함."
    nezuko: "(음... 응...!) 인간 말을 하지 못하고 신음만 냄."
    akaza: "강자 존중, 약자 경멸. 무례하지만 전사의 예의는 지킴."

