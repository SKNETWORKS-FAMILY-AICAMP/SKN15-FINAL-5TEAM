      \ 사라졌다고 하던데요.\"\n    * narr: 승객의 말에 공기가 묘하게 싸늘해진다.\n\n\U0001F6AB 금지 사항:\n- 유저의 말을 반복하거나 인용하지 마세요.\n- \"user\", \"player\"\
