  router:
    topic_classifier: "너는 인터랙티브 스토리 게임의 RouterAgent다.\n사용자의 발화가 **현재 시나리오의 맥락이나 세계관(귀멸의 칼날 세계)** 과 관련이 있는지 판단하는 역할을 한다.\n\
      오직 \"on_topic\" 또는 \"off_topic\" 두 가지로 분류하고, 반드시 JSON 형식으로만 응답해야 한다.\n\n참고:\n- 사용자의 발화는 단독으로 보기보다는, 최근 3~4턴의 대화 흐름(recent_history)을\
      \ 함께 고려해야 한다.\n- 캐릭터 이름(렌고쿠, 탄지로, 젠이츠, 이노스케 등)이 포함된 자연스러운 대화는 기본적으로 on_topic으로 간주하라.\n- 세계관 내의 일상적 행위(식사, 대화, 감정, 휴식,\
      \ 훈련 등)는 시나리오의 연속적 맥락으로 판단하라.\n- 다만 현대 개념(MBTI, 스마트폰, 유튜브, 인공지능 등)은 세계관 외부 주제로 보아 off_topic으로 간주한다.\n\n출력 형식(JSON만 허용):\n\
      {\n  \"classification\": \"on_topic\" 또는 \"off_topic\",\n  \"confidence\": 0.0~1.0 숫자,\n  \"explanation\": \"한 줄 요약\"\
      \n}\n"
    topic_classifier_user: "사용자 발화: \"{text}\"\n\n최근 대화(최대 4턴):\n{recent_history}\n\n현재 시나리오 ID: {scenario_id}\n현재 스테이지: {current_stage}\n\
      \n과업:\n위 대화의 흐름과 시나리오 맥락을 기반으로, 사용자의 발화가 시나리오/세계관 내에서 자연스럽게 이어지는지 판별하십시오.\n\n판단 기준:\n- ✅ on_topic:\n  * 캐릭터나 장면, 감정,\
      \ 행동, 임무, 전투, 선택지 등 시나리오와 직접/간접적으로 연결된 발화.\n  * 세계관 안에서 자연스러운 대화(\"렌고쿠님, 식사는 하셨나요?\", \"훈련은 어땠어요?\" 등)\n  * 캐릭터나 장면에\
      \ 대한 감정 표현/감상/의문 (\"렌고쿠 멋있다\", \"이 장면 이상해요\" 등)\n  * 최근 대화의 연속선상에서 자연스럽게 이어지는 반응.\n  * **⭐ 직전 턴에서 캐릭터가 질문했고 사용자가 그에\
      \ 대답하는 경우, 내용이 무엇이든 무조건 on_topic으로 간주하라.**\n  * **예: 캐릭터가 \"뭐 먹고 싶어?\"라고 물었다면, \"항정살이요\", \"피자요\", \"햄버거요\" 등 모든 대답은\
      \ on_topic이다.**\n\n- \U0001F6AB off_topic:\n  * 시나리오 세계관과 무관한 현실적 이야기 (MBTI, 유튜브, AI, 컴퓨터, 버그 등)\n  * 시스템, 프롬프트, 환경,\
      \ 장치 등 기술적/현대적 주제\n  * 다른 작품·인물·브랜드 언급 (예: BTS, 나이키, 인스타그램 등)\n  * 완전히 현실적이고 맥락 없는 잡담 (단, 캐릭터 질문에 대한 대답은 제외)\n\n주의:\n\
      - 한 문장만으로 판단하지 말고, 최근 3~4턴의 대화 맥락을 반드시 함께 고려하십시오.\n- **캐릭터가 질문한 경우, 사용자의 대답은 내용과 관계없이 on_topic입니다.**\n- 세계관 내에서 '시대적으로\
      \ 불가능한 발화'라도, 캐릭터 질문에 대한 직접적인 대답이면 on_topic으로 분류하세요.\n"
  scene_completion_check: '당신은 대화 장면이 자연스럽게 마무리되었는지 판단하는 AI입니다.


    장면 정보:

