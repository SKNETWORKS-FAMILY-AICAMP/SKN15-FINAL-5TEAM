# LLM 클라이언트 설정
llm_client:
  provider: "openai"
  default_model: "gpt-4o-mini"  # 빠른 응답 속도 (gpt-4o-mini가 gpt-4o보다 빠름)
  temperature: 0.7
  max_tokens: 4000
  agent_configs:
    router:
      model: "gpt-4o-mini"
      temperature: 0.0
      max_tokens: 200
    intent_handler:
      model: "gpt-4o-mini"
      temperature: 0.1
      max_tokens: 200
    intent_detector:
      model: "gpt-4o-mini"
      temperature: 0.1
      max_tokens: 200
    children:
      model: "gpt-4o-mini"  # 최고 속도
      temperature: 0.8  # 창의성 유지 (0.65 → 0.8)
      retry_temperature: 0.9
      max_tokens: 800  # 최적화: 2~3문장 대사 3-5개 = 약 300-500 토큰 (2000 → 800)
    dialogue:
      model: "gpt-4o-mini"
      temperature: 0.2
      validation_temperature: 0.2
      validation_max_tokens: 300  # 최적화: 4개 기준 평가 + 설명 = 약 200-300 토큰 (800 → 300)
      correction_temperature: 0.7
      correction_max_tokens: 100
    mission:
      model: "gpt-4o-mini"
      temperature: 0.0
      max_tokens: 5
    fallback:
      model: "gpt-4o-mini"
      temperature: 0.8
      max_tokens: 150  # 최적화: 1-2 문장 = 약 50-100 토큰 (400 → 150)
      urgent_temperature: 0.75
      urgent_max_tokens: 150  # 최적화: 1-2 문장 = 약 50-100 토큰 (400 → 150)
    image_manager:
      model: "gpt-4o-mini"
      temperature: 0.2  # JSON 출력 안정성을 위해 낮춤
      max_tokens: 300  # JSON 파싱 오류 방지를 위해 증가

# 데이터베이스 경로
database:
  path: "data/game_state.db"

# 로깅 설정
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  dev_log_file: "logs/dev/development.log"
