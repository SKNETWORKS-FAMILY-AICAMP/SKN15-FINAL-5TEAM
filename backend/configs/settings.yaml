# LLM 클라이언트 설정
llm_client:
  provider: "openai"
  default_model: "gpt-4-turbo"
  temperature: 0.7
  max_tokens: 4000
  agent_configs:
    router:
      model: "gpt-4o-mini"
      temperature: 0.0
      max_tokens: 200
    intent_handler:
      model: "gpt-4o-mini"
      temperature: 0.1
      max_tokens: 200
    intent_detector:
      model: "gpt-4o-mini"
      temperature: 0.1
      max_tokens: 200
    children:
      model: "gpt-4-turbo"
      temperature: 0.65
      retry_temperature: 0.9
      max_tokens: 2000
    dialogue:
      model: "gpt-4o-mini"
      temperature: 0.2
      validation_temperature: 0.2
      validation_max_tokens: 800
      correction_temperature: 0.7
      correction_max_tokens: 100
    mission:
      model: "gpt-4o-mini"
      temperature: 0.0
      max_tokens: 5
    fallback:
      model: "gpt-4o-mini"
      temperature: 0.8
      max_tokens: 80
      urgent_temperature: 0.75
      urgent_max_tokens: 90
    image_manager:
      model: "gpt-4o-mini"
      temperature: 0.3
      max_tokens: 200

# 데이터베이스 경로
database:
  path: "data/game_state.db"

# 로깅 설정
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  dev_log_file: "logs/dev/development.log"
