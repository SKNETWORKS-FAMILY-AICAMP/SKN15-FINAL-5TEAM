# KIME Chat Redis Configuration

# Network
bind 0.0.0.0
protected-mode no
port 6379

# General
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
databases 16

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Append Only File (AOF)
appendonly no
appendfilename "appendonly.aof"
appendfsync everysec

# Performance
timeout 0
tcp-keepalive 300
tcp-backlog 511

# Security
# requirepass yourpassword  # Uncomment and set password in production

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitor
latency-monitor-threshold 100
