services:
  # PostgreSQL Database with pgvector
  postgres:
    image: ankane/pgvector:latest
    container_name: kime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kimedb}
      POSTGRES_USER: ${DB_USER:-kime}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kime} -d ${DB_NAME:-kimedb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kime-network

volumes:
  postgres_data:
    driver: local

networks:
  kime-network:
    external: true
    name: kime-network
